name: Android app

# Builds the Capacitor Android shell around app/ on a Linux runner. Signed release APK + AAB when the keystore
# secrets exist (created once with `node tools/android-keystore-setup.mjs`), otherwise a debug-signed APK for testing.
#   ANDROID_KEYSTORE_BASE64    PKCS#12 keystore as base64
#   ANDROID_KEYSTORE_PASSWORD  its password (also used for the key)
#   ANDROID_KEY_ALIAS          key alias (default rnanalyzer)
# Tags `android-v*` publish the APK/AAB as a GitHub Release, so customers can download it from
#   https://github.com/maxzmacrix/rnanalyzer/releases/latest/download/RN-Analyzer.apk
# A manual run with `release: true` does the same without a tag (the release step creates the tag
# `android-v<version>-b<run>` on the built commit).

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release (creates the tag android-v<version>-b<run>)
        type: boolean
        default: false
  push:
    tags: ['android-v*']
    branches: [main]
    paths: ['native/**', 'capacitor.config.json', 'package.json', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MARKETING_VERSION: '2.1.26'
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 platforms;android-35 build-tools;34.0.0 build-tools;35.0.0'

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: |
          set -o pipefail
          npx cap add android 2>&1 | tee /tmp/cap-add.log || { echo "::error title=cap add android::$(tail -c 1500 /tmp/cap-add.log | tr '\n' ' ')"; exit 1; }
          npx cap sync android 2>&1 | tee /tmp/cap-sync.log || { echo "::error title=cap sync android::$(tail -c 1500 /tmp/cap-sync.log | tr '\n' ' ')"; exit 1; }
          cat android/app/src/main/assets/capacitor.plugins.json

      - name: Configure project (version, min SDK, cleartext HTTP to the device, icons, splash)
        run: |
          set -e
          G=android/app/build.gradle
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$MARKETING_VERSION\"/" "$G"
          sed -i 's/minSdkVersion = 22/minSdkVersion = 26/; s/compileSdkVersion = 34/compileSdkVersion = 35/' android/variables.gradle
          # Health Connect client needs compileSdk 35; AGP 8.2 only warns about it
          printf '\nandroid.suppressUnsupportedCompileSdk=35\n' >> android/gradle.properties
          # the Race Navigator speaks plain HTTP/FTP in its own WiFi
          sed -i 's/android:allowBackup="true"/android:allowBackup="true"\n        android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          # RN logo: launcher icons (adaptive + legacy) and dark splash
          R=android/app/src/main/res
          rm -rf "$R"/mipmap-* "$R"/drawable-port-* "$R"/drawable-land-*
          cp -r native/android-res/. "$R"/
          grep -n "versionCode\|versionName" "$G"; grep -n "usesCleartextTraffic" android/app/src/main/AndroidManifest.xml
          ls "$R"
          # build identity for the in-app update check (app/js/update.js)
          TAG="${GITHUB_REF#refs/tags/}"; case "$GITHUB_REF" in refs/tags/*) ;; *) TAG="";; esac
          if [ -z "$TAG" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.release }}" = "true" ]; then TAG="android-v${MARKETING_VERSION}-b${{ github.run_number }}"; fi
          echo "{\"platform\":\"android\",\"version\":\"$MARKETING_VERSION\",\"build\":${{ github.run_number }},\"tag\":\"$TAG\"}" > android/app/src/main/assets/public/build.json
          mkdir -p "$RUNNER_TEMP/out"
          echo "{\"platform\":\"android\",\"version\":\"$MARKETING_VERSION\",\"build\":${{ github.run_number }},\"tag\":\"$TAG\",\"apk\":\"https://github.com/$GITHUB_REPOSITORY/releases/latest/download/RN-Analyzer.apk\",\"release\":\"https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG\"}" > "$RUNNER_TEMP/out/latest.json"
          cat android/app/src/main/assets/public/build.json "$RUNNER_TEMP/out/latest.json"

      - name: Signing config
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release.p12" || { echo "::error title=ANDROID_KEYSTORE_BASE64::not valid base64"; exit 1; }
          echo "::notice::keystore $(stat -c%s "$RUNNER_TEMP/release.p12") bytes"
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("RN_KEYSTORE_FILE"))
                      storePassword System.getenv("RN_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("RN_KEY_ALIAS")
                      keyPassword System.getenv("RN_KEYSTORE_PASSWORD")
                      storeType "pkcs12"
                  }
              }
              buildTypes { release { signingConfig signingConfigs.release } }
          }
          EOF

      - name: Build (release, signed)
        if: env.HAS_KEYSTORE == 'true'
        env:
          RN_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          RN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'rnanalyzer' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease > /tmp/gradle.log 2>&1 \
            || { echo "::error title=gradle::$( (grep -iE 'requires|compile against|Gradle plugin|e: |error:|Unresolved|Could not' /tmp/gradle.log | head -25; echo '--- what went wrong ---'; grep -A14 'What went wrong' /tmp/gradle.log | head -40) | tr '\n' '|' | cut -c1-3800)"; tail -n 120 /tmp/gradle.log; exit 1; }
          tail -n 5 /tmp/gradle.log
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/RN-Analyzer.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/out/RN-Analyzer.aab"
          ls -la "$RUNNER_TEMP/out"

      - name: Build (debug – no keystore secrets)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning title=No keystore::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD are not set – building a debug-signed APK (installable for testing, not for Play Store). Run 'node tools/android-keystore-setup.mjs' once and add the secrets."
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug > /tmp/gradle.log 2>&1 \
            || { echo "::error title=gradle::$( (grep -iE 'requires|compile against|Gradle plugin|e: |error:|Unresolved|Could not' /tmp/gradle.log | head -25; echo '--- what went wrong ---'; grep -A14 'What went wrong' /tmp/gradle.log | head -40) | tr '\n' '|' | cut -c1-3800)"; tail -n 120 /tmp/gradle.log; exit 1; }
          tail -n 5 /tmp/gradle.log
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/out/RN-Analyzer-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RN-Analyzer-android
          path: ${{ runner.temp }}/out/*
          retention-days: 30

      - name: Publish GitHub Release (tag, or manual run with release=true)
        if: startsWith(github.ref, 'refs/tags/android-v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"; case "$GITHUB_REF" in refs/tags/*) ;; *) TAG="android-v${MARKETING_VERSION}-b${{ github.run_number }}";; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP"/out/* --repo "$GITHUB_REPOSITORY" --clobber 2> /tmp/gh.log || { echo "::error title=release upload::$(tr '\n' ' ' < /tmp/gh.log | cut -c1-1500)"; exit 1; }
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest > /dev/null 2>&1 || true
          else
            gh release create "$TAG" "$RUNNER_TEMP"/out/* --repo "$GITHUB_REPOSITORY" --latest --target "$GITHUB_SHA" \
              --title "RN Analyzer $MARKETING_VERSION for Android (build ${{ github.run_number }})" \
              --notes "Android app for the Race Navigator. Install: download RN-Analyzer.apk on the phone, open it and allow the installation. RN-Analyzer.aab is the Play Store bundle." 2> /tmp/gh.log \
              || { echo "::error title=release create::$(tr '\n' ' ' < /tmp/gh.log | cut -c1-1500)"; exit 1; }
          fi
          echo "::notice title=Release::https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

name: iOS app → TestFlight

# Builds the Capacitor iOS shell around app/ on a GitHub-hosted Mac and uploads it to TestFlight.
# No local Mac needed. Repository secrets (Settings → Secrets and variables → Actions):
#   Signing (created once with `node tools/ios-signing-setup.mjs …`, valid one year):
#     IOS_P12_BASE64       Apple Distribution certificate + private key (.p12) as base64
#     IOS_P12_PASSWORD     password of that .p12
#     IOS_PROFILE_BASE64   App Store provisioning profile (.mobileprovision) as base64
#   Upload to TestFlight (App Store Connect API key):
#     ASC_KEY_ID           key ID (10 characters)         ASC_ISSUER_ID   issuer ID (UUID)
#     ASC_KEY_P8           full content of AuthKey_<KEY_ID>.p8
# Optional repository variables: APPLE_TEAM_ID (default Z2LYJ5597T), IOS_BUNDLE_ID (default com.macrix.RN-Analyzer)

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight after building
        type: boolean
        default: true
  push:
    tags: ['ios-v*']
    branches: [main]
    paths: ['native/**', 'capacitor.config.json', 'package.json', '.github/workflows/ios.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26   # App Store Connect requires the iOS 26 SDK (Xcode 26) since 2026
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ vars.APPLE_TEAM_ID || 'Z2LYJ5597T' }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.macrix.RN-Analyzer' }}
      MARKETING_VERSION: '2.1.16'
      MIN_IOS: '16.4'
      HAS_KEY: ${{ secrets.ASC_KEY_P8 != '' }}
      HAS_SIGNING: ${{ secrets.IOS_P12_BASE64 != '' && secrets.IOS_P12_PASSWORD != '' && secrets.IOS_PROFILE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || echo /Applications/Xcode.app)" && xcodebuild -version && xcodebuild -showsdks | grep -i iphoneos

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Create iOS project
        run: |
          set -o pipefail
          # Capacitor only accepts dash-free ids; the real bundle id (may contain a dash) is applied to the Xcode project below.
          npx cap add ios 2>&1 | tee /tmp/cap-add.log || { echo "::error title=cap add ios::$(tail -c 1500 /tmp/cap-add.log | tr '\n' ' ')"; exit 1; }
          npx cap sync ios 2>&1 | tee /tmp/cap-sync.log || { echo "::error title=cap sync ios::$(tail -c 1500 /tmp/cap-sync.log | tr '\n' ' ')"; exit 1; }

      - name: Apply bundle id to the Xcode project
        run: |
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com.macrix.rnanalyzer;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" ios/App/App.xcodeproj/project.pbxproj
          grep -c "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" ios/App/App.xcodeproj/project.pbxproj
          # minimum iOS: the RNZ import relies on DecompressionStream (WebKit ≥ 16.4)
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [^;]*;/IPHONEOS_DEPLOYMENT_TARGET = $MIN_IOS;/g" ios/App/App.xcodeproj/project.pbxproj
          grep -c "IPHONEOS_DEPLOYMENT_TARGET = $MIN_IOS;" ios/App/App.xcodeproj/project.pbxproj

      - name: App icon and launch screen (RN logo)
        run: |
          A=ios/App/App/Assets.xcassets
          cp native/ios-assets/AppIcon-1024.png "$A/AppIcon.appiconset/AppIcon-512@2x.png"
          for f in splash-2732x2732.png splash-2732x2732-1.png splash-2732x2732-2.png; do cp native/ios-assets/splash-2732.png "$A/Splash.imageset/$f"; done
          # launch screen background = app background (dark)
          sed -i '' 's/red="1" green="1" blue="1" alpha="1" colorSpace="custom" customColorSpace="sRGB"/red="0.027" green="0.031" blue="0.039" alpha="1" colorSpace="custom" customColorSpace="sRGB"/g' ios/App/App/Base.lproj/LaunchScreen.storyboard || true
          ls -la "$A/AppIcon.appiconset" "$A/Splash.imageset"

      - name: Configure Info.plist (local network, Bonjour, HTTP to device, version)
        run: |
          PLIST=ios/App/App/Info.plist
          BUILD="2.1.${{ github.run_number }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING_VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'RN Analyzer connects to your Race Navigator in the local WiFi to download laps and videos.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:0 string _racenav._tcp" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSHealthShareUsageDescription string 'RN Analyzer reads your heart rate from Apple Health to show it next to the lap data.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSHealthUpdateUsageDescription string 'RN Analyzer does not write health data.'" "$PLIST"
          # HealthKit entitlement (capability is enabled on the App ID and part of the provisioning profile)
          cat > ios/App/App/App.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.developer.healthkit</key><true/>
            <key>com.apple.developer.healthkit.access</key><array/>
          </dict></plist>
          EOF
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST"
          # project-level version fields used by Xcode
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $MARKETING_VERSION;/g; s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $BUILD;/g" ios/App/App.xcodeproj/project.pbxproj || true

      - name: Compile check (unsigned) – always runs, catches Swift/Pod errors without any secrets
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release             -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" build             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > /tmp/xcodebuild.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" /tmp/xcodebuild.log | head -40
          if test -d "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app"; then echo "Unsigned build OK"; else
            echo "::error title=xcodebuild::$(grep -E 'error:' /tmp/xcodebuild.log | head -15 | tr '\n' ' ' | cut -c1-3000)"
            tail -n 80 /tmp/xcodebuild.log; exit 1; fi

      - name: Signing secrets missing?
        if: env.HAS_SIGNING != 'true'
        run: |
          echo "::warning title=No signing secrets::IOS_P12_BASE64 / IOS_P12_PASSWORD / IOS_PROFILE_BASE64 are not set. Run 'node tools/ios-signing-setup.mjs --key <AuthKey.p8> --key-id <id> --issuer <uuid>' once and add the three secrets. Only the unsigned compile check ran."

      - name: Install signing certificate and provisioning profile
        if: env.HAS_SIGNING == 'true'
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -e
          P12="$RUNNER_TEMP/dist.p12"; PROF="$RUNNER_TEMP/dist.mobileprovision"
          printf '%s' "$IOS_P12_BASE64" | tr -d '[:space:]' | base64 --decode > "$P12" || { echo "::error title=IOS_P12_BASE64::not valid base64"; exit 1; }
          printf '%s' "$IOS_PROFILE_BASE64" | tr -d '[:space:]' | base64 --decode > "$PROF" || { echo "::error title=IOS_PROFILE_BASE64::not valid base64"; exit 1; }
          echo "::notice::p12 $(stat -f%z "$P12") bytes, profile $(stat -f%z "$PROF") bytes"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"; KC_PW="$(uuidgen)"
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          # Apple intermediate certificates (needed for the trust chain of the distribution certificate)
          for c in AppleWWDRCAG3 AppleWWDRCAG4; do curl -fsSL "https://www.apple.com/certificateauthority/$c.cer" -o "$RUNNER_TEMP/$c.cer" && security import "$RUNNER_TEMP/$c.cer" -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security || true; done
          security import "$P12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN" \
            || { echo "::error title=p12 import::Could not import the .p12 – wrong IOS_P12_PASSWORD or corrupt IOS_P12_BASE64"; exit 1; }
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENT="$(security find-identity -v -p codesigning "$KEYCHAIN")"; echo "$IDENT"
          echo "$IDENT" | grep -q "Apple Distribution" || { echo "::error title=identity::No 'Apple Distribution' identity in the .p12: $(echo "$IDENT" | tr '\n' ' ')"; exit 1; }
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PROF" > "$RUNNER_TEMP/profile.plist"
          UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")"
          NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")"
          PBID="$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"
          EXP="$(/usr/libexec/PlistBuddy -c 'Print ExpirationDate' "$RUNNER_TEMP/profile.plist")"
          cp "$PROF" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "::notice::Profile '$NAME' for $PBID, expires $EXP"
          case "$PBID" in "$TEAM_ID.$BUNDLE_ID") ;; *) echo "::error title=profile::Profile is for '$PBID' but the app is '$TEAM_ID.$BUNDLE_ID'"; exit 1;; esac
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"; echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"; echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Configure manual signing in the Xcode project
        if: env.HAS_SIGNING == 'true'
        run: |
          PBX=ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; CODE_SIGN_IDENTITY = \"Apple Distribution\"; DEVELOPMENT_TEAM = $TEAM_ID; PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\"; CODE_SIGN_ENTITLEMENTS = App\/App.entitlements;/g" "$PBX"
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' "$PBX"
          grep -nE "CODE_SIGN|DEVELOPMENT_TEAM|PROVISIONING_PROFILE" "$PBX"

      - name: Write App Store Connect API key (for the TestFlight upload)
        if: env.HAS_KEY == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set +e
          ok=1
          KEY_ID="$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')"
          ISSUER="$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')"
          echo "::notice::ASC_KEY_ID length ${#KEY_ID}, ASC_ISSUER_ID length ${#ISSUER}, ASC_KEY_P8 length ${#ASC_KEY_P8}"
          if [ -z "$ASC_KEY_P8" ]; then echo "::error title=ASC_KEY_P8::Secret is empty"; ok=0; fi
          if ! printf '%s' "$KEY_ID" | grep -Eq '^[A-Z0-9]{8,12}$'; then echo "::error title=ASC_KEY_ID::Expected the 10-character Key ID (e.g. 2X9R4HXF34), got length ${#KEY_ID}"; ok=0; fi
          if ! printf '%s' "$ISSUER" | grep -Eqi '^[0-9a-f-]{36}$'; then echo "::error title=ASC_ISSUER_ID::Expected the Issuer ID UUID (36 characters), got length ${#ISSUER}"; ok=0; fi
          if ! printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then echo "::error title=ASC_KEY_P8::Expected the full content of AuthKey_<KEYID>.p8 starting with -----BEGIN PRIVATE KEY-----"; ok=0; fi
          [ "$ok" = "1" ] || exit 1
          set -e
          mkdir -p "$HOME/private_keys" ./private_keys
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          cp "$HOME/private_keys/AuthKey_${KEY_ID}.p8" ./private_keys/
          chmod 600 "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          echo "KEY_ID=$KEY_ID" >> "$GITHUB_ENV"; echo "ISSUER=$ISSUER" >> "$GITHUB_ENV"

      - name: Archive (manual signing, Apple Distribution)
        if: env.HAS_SIGNING == 'true'
        run: |
          set -o pipefail
          report() { MSG="$( (grep -iE 'error|fail|provision|certificat|entitle|team|bundle' "$2" | grep -v '^\s*$' | head -30; echo '--- tail ---'; tail -n 30 "$2") | tr '\n' '|' | cut -c1-3800)"; echo "::error title=$1::${MSG}"; }
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" > /tmp/archive.log 2>&1 \
            || { report archive /tmp/archive.log; tail -n 150 /tmp/archive.log; exit 1; }
          grep -E "ARCHIVE SUCCEEDED|Signing Identity|Provisioning Profile" /tmp/archive.log | head -5

      - name: Export IPA
        if: env.HAS_SIGNING == 'true'
        run: |
          report() { MSG="$( (grep -iE 'error|fail|provision|certificat|entitle|team|bundle' "$2" | grep -v '^\s*$' | head -30; echo '--- tail ---'; tail -n 30 "$2") | tr '\n' '|' | cut -c1-3800)"; echo "::error title=$1::${MSG}"; }
          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" > /tmp/export.log 2>&1 \
            || { report exportArchive /tmp/export.log; tail -n 150 /tmp/export.log; exit 1; }
          tail -n 15 /tmp/export.log
          ls -la "$RUNNER_TEMP/export"

      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING == 'true'
        with:
          name: RN-Analyzer-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30

      - name: Upload to TestFlight
        if: ${{ env.HAS_SIGNING == 'true' && env.HAS_KEY == 'true' && (startsWith(github.ref, 'refs/tags/ios-v') || inputs.upload) }}
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app --type ios -f "$IPA" --apiKey "$KEY_ID" --apiIssuer "$ISSUER" > /tmp/upload.log 2>&1 \
            || { echo "::error title=TestFlight upload::$(grep -iE 'error|fail' /tmp/upload.log | head -20 | tr '\n' '|' | cut -c1-3500)"; tail -n 60 /tmp/upload.log; exit 1; }
          tail -n 20 /tmp/upload.log
          echo "::notice title=TestFlight::Build 2.1.${{ github.run_number }} uploaded – it appears in App Store Connect → TestFlight after processing (5–15 min)."

      - name: Clean up keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$KEYCHAIN" 2>/dev/null || true

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>RN Analyzer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="description" content="Race Navigator lap analysis – offline web app for iPhone, iPad and desktop." />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RN Analyzer" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <nav class="tabbar" id="tabbar">
      <a href="#/laps" data-view="laps">
        <svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h10v2H4z"/></svg><span data-i18n="nav_laps">Laps</span>
      </a>
      <a href="#/analyzer" data-view="analyzer">
        <svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 5-8 4 5v5H3z" opacity=".5"/><path d="M3 3h2v18h16v-2H5V3zM8 13l4 4 5-8 4 5-1.6 1.2L17 12.4l-4.7 7.5L8 15.8l-3.4 4.1L3 18.6z"/></svg><span data-i18n="nav_analyzer">Analyzer</span>
      </a>
      <a href="#/gforce" data-view="gforce">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16zm-1 3h2v4h4v2h-4v4h-2v-4H7v-2h4z"/></svg><span data-i18n="nav_gforce">G‑Force</span>
      </a>
      <a href="#/video" data-view="video">
        <svg viewBox="0 0 24 24"><path d="M4 5h12a2 2 0 0 1 2 2v2.5l4-2.5v10l-4-2.5V17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg><span data-i18n="nav_video">Video</span>
      </a>
      <a href="#/devices" data-view="devices">
        <svg viewBox="0 0 24 24"><path d="M12 3C7 3 2.7 5 0 8l2 2.2C4.3 7.7 8 6 12 6s7.7 1.7 10 4.2L24 8c-2.7-3-7-5-12-5zm0 6c-3 0-5.8 1.2-7.8 3.2l2 2.1C7.7 12.9 9.7 12 12 12s4.3.9 5.8 2.3l2-2.1C17.8 10.2 15 9 12 9zm0 6a4 4 0 0 0-3.5 2l3.5 4 3.5-4a4 4 0 0 0-3.5-2z"/></svg><span data-i18n="nav_devices">Devices</span>
      </a>
      <a href="#/control" data-view="control">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 3a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm0 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg><span data-i18n="nav_control">Control</span>
      </a>
      <a href="#/settings" data-view="settings">
        <svg viewBox="0 0 24 24"><path d="M19.4 13a7.7 7.7 0 0 0 0-2l2-1.5-2-3.5-2.4 1a7.6 7.6 0 0 0-1.7-1L15 3H9l-.3 2.9a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.5L4.6 11a7.7 7.7 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a7.6 7.6 0 0 0 1.7 1L9 21h6l.3-2.9a7.6 7.6 0 0 0 1.7-1l2.4 1 2-3.5-2-1.6zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg><span data-i18n="nav_settings">Settings</span>
      </a>

    <div class="content">
      <div id="update-banner" class="update-banner hidden"></div>
      <header class="topbar" id="topbar">
        <div id="top-left" class="row"></div>
        <h1 id="top-title">RN Analyzer</h1>
        <div id="top-right" class="row"></div>
      </header>
      <main class="main" id="main"></main>
    </div>
  </div>
  <div id="overlay"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
